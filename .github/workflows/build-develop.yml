name: Build develop workflow

on:
  pull_request:
    # PRs must be verified with the full build/test suite before merge,
    # not only after being closed (see issue #25).
    types: [opened, synchronize, reopened, closed]
    branches: ['develop','main']
  workflow_dispatch:
    inputs:
      BASELINE:
        description: 'Baseline branch'
        required: true
        default: 'main'
        
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - 5.2.1

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install dependencies
        # No --with-doc: odoc and per-dependency docs are not needed for
        # build/test verification and are the slowest part of the setup.
        run: opam install . --deps-only --with-test

      - name: Build AnMetriGal
        run: |
          eval "$(opam env)"
          dune --version
          dune build --verbose

      - name: Run tests
        run: |
          eval "$(opam env)"
          dune test --verbose

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: anmetrigal.exe
          path: _build/default/bin/anmetrigal.exe
